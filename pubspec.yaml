name: factory_managment
description: "Building Materials Factory & Contracting - Offline First Business Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  file_picker: ^10.1.9
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  archive: ^4.0.7
  crypto: ^3.0.6
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  fl_chart: ^0.71.0
  shimmer: ^3.0.0
  device_info_plus: ^12.4.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
